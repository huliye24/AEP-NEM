name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .[dev]
      - name: Test
        run: pytest -q
      - name: Validate example AEP
        run: aep validate examples/MT-001_Runtime_Cloud_System_AEP_v0.1
